<html>
  <body>
    <head>
      <link rel="stylesheet" href="home.css" />
      <link />
    </head>
    <div class="login-container">
      <form (ngSubmit)="onSubmit()">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
        />
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Password"
        />
        <button type="submit">Sign in</button>
      </form>
    </div>
  </body>
</html>
