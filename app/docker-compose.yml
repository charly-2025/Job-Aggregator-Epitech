services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json
        - action: rebuild
          path: ./backend/package-lock.json

  frontend:
    build: ./frontend/jobaggregator
    ports:
      - "3001:3001"
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/jobaggregator
          target: /app
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/jobaggregator/package.json
        - action: rebuild
          path: ./frontend/jobaggregator/package-lock.json