name: Angular Frontend Build Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_quality_checks:
    name: Angular Frontend Build Tests
    runs-on: [self-hosted]
    container:
      image: epitechcontent/epitest-docker:latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: ./project/frontend/jobaggregator
        run: npm ci

      - name: Run tests
        working-directory: ./project/frontend/jobaggregator
        run: npx ng test --watch=false --progress=false

      - name: Build
        working-directory: ./project/frontend/jobaggregator
        run: npm run build

      - name: Run ESLint
        run: npx eslint . --max-warnings=0

      - name: Run Prettier check
        run: npx prettier --check .
