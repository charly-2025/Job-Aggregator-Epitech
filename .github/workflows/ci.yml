name: CI Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build_quality_checks:
    name: CI Tests
    runs-on: [self-hosted]
    container:
      image: epitechcontent/epitest-docker:latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - name: Checkout the source code
        uses: actions/checkout@v3

      - name: Install Python + pip
        working-directory: ./filling_database
        run: |
          apt-get update
          apt-get install -y python3-venv python3-pip

          python3 -m venv venv

          ./venv/bin/python -m pip install --upgrade pip
          ./venv/bin/python -m pip install -r requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install frontend dependencies
        working-directory: ./app/frontend
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./app/backend
        run: npm ci

      - name: Install root dependencies
        run: npm ci

      - name: Create .env in backend
        run: |
          cat <<EOF > app/.env
          JWT_SECRET=test
          REFRESH_SECRET=test

          MYSQL_PASSWORD=test
          MYSQL_USER=root
          MYSQL_HOST=mysql
          MYSQL_DATABASE=jobagg

          MYSQL_DOCKER_HOST=mysql
          MYSQL_DOCKER_USER=docker

          BACKEND_PORT=3001
          FRONTEND_PORT=3000
          EOF

      - name: Create .env in filling_database folder
        run: |
          cat <<EOF > filling_database/.env
          MYSQL_PASSWORD=test
          WLD_API_KEY=${{ secrets.WLD_API_KEY }}
          MYSQL_USER=root
          MYSQL_HOST=localhost
          MYSQL_DATABASE=jobagg
          MYSQL_PORT=3307
          EOF

      - name: docker compose up
        working-directory: ./app
        run: docker compose up -d --build

      - name: start python script filling database
        working-directory: ./filling_database
        run: ./venv/bin/python run_pipeline.py

      - name: Wait
        run: sleep 50

      - name: Run ESLint
        run: npx eslint app/frontend/src app/backend --max-warnings=0

      - name: Run Prettier check
        run: npx prettier --check .

      - name: Stop docker
        if: always()
        working-directory: ./app
        run: docker compose down
