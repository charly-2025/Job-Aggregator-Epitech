name: Seed Issues

on:
  workflow_dispatch:

jobs:
  create-issues:
    runs-on: [self-hosted]
    container:
      image: epitechcontent/epitest-docker:latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issues = JSON.parse(`[
              { "title": "Backend Dockerfile", "labels": ["devops"] },
              { "title": "Frontend Dockerfile", "labels": ["devops"] },
              { "title": "Database Docker", "labels": ["devops"] },
              { "title": "Complete docker-compose setup", "labels": ["devops"] },
              { "title": "Verify docker-compose up works", "labels": ["devops"] },

              { "title": "Think about which technology for the database", "labels": ["database"] },
              { "title": "Define Users schema", "labels": ["database"] },
              { "title": "Define Offers schema", "labels": ["database"] },
              { "title": "Define Roles schema", "labels": ["database"] },
              { "title": "Add relations (FK)", "labels": ["database"] },
              { "title": "Add constraints (not null, unique)", "labels": ["database"] },
              { "title": "Verify persistence after restart", "labels": ["database"] },

              { "title": "Register endpoint", "labels": ["backend"] },
              { "title": "Login endpoint", "labels": ["backend"] },
              { "title": "Password hashing (bcrypt)", "labels": ["security"] },
              { "title": "JWT generation", "labels": ["security"] },
              { "title": "Auth middleware", "labels": ["security"] },
              { "title": "Role middleware (USER/ADMIN)", "labels": ["security"] },
              { "title": "GET /me endpoint", "labels": ["backend"] },
              { "title": "Update user endpoint", "labels": ["backend"] },
              { "title": "Protect sensitive routes (user cannot access admin routes)", "labels": ["security"] },
              { "title": "Logout or token invalidation", "labels": ["security"] },

              { "title": "GET /offers", "labels": ["backend"] },
              { "title": "GET /offers/:id", "labels": ["backend"] },
              { "title": "POST /offers (admin)", "labels": ["backend"] },
              { "title": "PUT /offers (admin)", "labels": ["backend"] },
              { "title": "DELETE /offers (admin)", "labels": ["backend"] },
              { "title": "Pagination implementation", "labels": ["backend"] },
              { "title": "Sorting offers", "labels": ["backend"] },
              { "title": "Filtering offers", "labels": ["backend"] },
              { "title": "Full-text search", "labels": ["backend"] },

              { "title": "Integrate WeLoveDevs API", "labels": ["data"] },
              { "title": "Fetch external offers", "labels": ["data"] },
              { "title": "Respect rate limit (1 request per second)", "labels": ["data"] },
              { "title": "Normalize incoming data", "labels": ["data"] },
              { "title": "Duplicate detection (if external sources exist)", "labels": ["data"] },
              { "title": "Data ingestion must include preprocessing before storage", "labels": ["data"] },
              { "title": "Store offers in database", "labels": ["data"] },

              { "title": "Compute average salary by job", "labels": ["data"] },
              { "title": "Create graphs for offers", "labels": ["data"] },
              { "title": "GET /analytics endpoint", "labels": ["backend"] },

              { "title": "Login page", "labels": ["frontend"] },
              { "title": "Register page", "labels": ["frontend"] },
              { "title": "Token management", "labels": ["frontend"] },
              { "title": "Auth error handling", "labels": ["frontend"] },
              { "title": "Offers list page", "labels": ["frontend"] },
              { "title": "Offer detail page", "labels": ["frontend"] },
              { "title": "Salary and location display", "labels": ["frontend"] },

              { "title": "Search bar", "labels": ["frontend"] },
              { "title": "Filters UI", "labels": ["frontend"] },
              { "title": "Pagination UI", "labels": ["frontend"] },
              { "title": "Dashboard UI", "labels": ["frontend"] },
              { "title": "Analytics charts", "labels": ["frontend"] },
              { "title": "AI feature display", "labels": ["frontend"] },

              { "title": "Admin panel offers", "labels": ["frontend"] },
              { "title": "Admin ingestion button", "labels": ["frontend"] },
              { "title": "Admin user management (optional)", "labels": ["frontend"] },

              { "title": "Choose AI feature", "labels": ["ai"] },
              { "title": "AI backend endpoint", "labels": ["ai"] },
              { "title": "AI frontend integration", "labels": ["ai"] },
              { "title": "Ensure response time under 5 seconds and small payload size", "labels": ["ai"] },

              { "title": "OWASP pentesting", "labels": ["security"] },

              { "title": "Run tests (endpoints, frontend, etc.) and report errors as issues tagged bug", "labels": ["tests"] },

              { "title": "Project README", "labels": ["docs"] },
              { "title": "Required dependencies documentation", "labels": ["docs"] },
              { "title": "Architecture overview (why, how, trade-offs with evidence)", "labels": ["docs"] },
              { "title": "Dashboard choices (why, how, trade-offs with evidence)", "labels": ["docs"] },
              { "title": "AI choice explanation (why, how, trade-offs with evidence)", "labels": ["docs"] },
              { "title": "Data choices explanation (why, how, trade-offs with evidence)", "labels": ["docs"] },
              { "title": "Business and product design explanation (why, how, trade-offs with evidence)", "labels": ["docs"] },
              { "title": "Security explanation and threat model (why, how, controls)", "labels": ["docs"] },
              { "title": "CI choices and quality pipeline explanation", "labels": ["docs"] },
              { "title": "API documentation (Swagger UI)", "labels": ["docs"] },

              { "title": "Keyboard navigation", "labels": ["frontend"] },
              { "title": "Color contrast compliance", "labels": ["frontend"] },
              { "title": "Focus states visibility", "labels": ["frontend"] },

              { "title": "Competitor analysis", "labels": ["product"] },
              { "title": "Define user personas", "labels": ["product"] },
              { "title": "Define value proposition", "labels": ["product"] },
              { "title": "Wireframes login and register", "labels": ["design"] },
              { "title": "Wireframes dashboard", "labels": ["design"] },
              { "title": "Wireframes offers list", "labels": ["design"] },
              { "title": "Wireframes admin panel", "labels": ["design"] },
              { "title": "User flows definition", "labels": ["product"] },
              { "title": "Define success metrics", "labels": ["product"] }
            ]`);

            for (const issue of issues) {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: issue.title, labels: issue.labels,});
            }
